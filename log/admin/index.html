<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E45C8">
<title>Coach Admin · TALLEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Dongle:wght@400;700&display=swap">
<style>
:root{
  --chalk:#EDEBE6; --card:#F7F6F2; --chalk-deep:#E2DFD8; --ink:#17181C; --muted:#5F605C; --rule:#CFCBC2;
  --plate:#1E45C8; --plate-ink:#FFFFFF; --plate-soft:#DCE3F8; --good:#1F7A4D; --good-soft:#DCEFE4; --bad:#B42318; --bad-soft:#F8E0DD; --warn:#9A5B00;
  --display:'Dongle','Archivo',sans-serif;
  --body:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --chalk:#121318; --card:#1B1D24; --chalk-deep:#262933; --ink:#ECEBE6; --muted:#A3A49E; --rule:#33363F;
    --plate:#6F8EF5; --plate-ink:#0D1220; --plate-soft:#1F2A4D; --good:#5CC890; --good-soft:#173326; --bad:#F2836F; --bad-soft:#3A1E19; --warn:#E3A84A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --chalk:#121318; --card:#1B1D24; --chalk-deep:#262933; --ink:#ECEBE6; --muted:#A3A49E; --rule:#33363F;
  --plate:#6F8EF5; --plate-ink:#0D1220; --plate-soft:#1F2A4D; --good:#5CC890; --good-soft:#173326; --bad:#F2836F; --bad-soft:#3A1E19; --warn:#E3A84A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--chalk);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 60px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0}
h1{font-family:var(--display);font-weight:700;font-size:64px;line-height:.8;margin-top:6px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.brand{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.banner{font-size:14px;background:var(--chalk-deep);padding:10px 12px}

.week{display:flex;justify-content:space-between;align-items:center;gap:8px}
.week button{appearance:none;border:1.5px solid var(--rule);background:var(--card);min-width:44px;min-height:44px;cursor:pointer;font-weight:700}
.week button:disabled{opacity:.35;cursor:default}
.week strong{font-size:16px;text-align:center}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--rule);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:46px;line-height:.75;margin-bottom:6px}
.stat span{font-size:13px;color:var(--muted)}

.clients{display:flex;flex-direction:column;gap:10px}
.client{background:var(--card);border:1px solid var(--rule)}
.chead{appearance:none;border:0;background:none;width:100%;text-align:left;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;cursor:pointer}
.cname{font-size:19px;font-weight:700}
.cmeta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.cmeta strong{color:var(--ink);font-weight:600}
.count{font-weight:700;font-size:15px;white-space:nowrap}
.count.full{color:var(--good)}
.pips{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.pip{font-size:12.5px;font-weight:600;padding:3px 8px;border:1.5px solid var(--rule);color:var(--muted)}
.pip.done{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.chev{font-size:13px;color:var(--plate);font-weight:700}
.cbody{border-top:1px solid var(--rule);padding:14px;display:flex;flex-direction:column;gap:16px}
.empty{font-size:14px;color:var(--muted)}

.sess{display:flex;flex-direction:column;gap:12px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.shead h3{font-size:17px}
.shead span{font-size:13px;color:var(--muted)}
.note{font-size:14px;border-left:3px solid var(--plate);padding-left:10px}
.ex h4{margin:0 0 4px;font-size:15px}
.ex h4 small{font-weight:500;color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--rule)}
td{padding:6px;border-bottom:1px solid var(--rule)}
td.c,th.c{text-align:center}
.hit{display:inline-grid;place-items:center;width:24px;height:24px;font-weight:800;font-size:13px}
.hit.y{background:var(--good-soft);color:var(--good)}
.hit.n{background:var(--bad-soft);color:var(--bad)}
.legend{font-size:12.5px;color:var(--muted)}
.sect{font-family:var(--display);font-size:44px;line-height:.8;margin-top:10px}
.leads{display:flex;flex-direction:column;gap:8px}
.lead{background:var(--card);border:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.lead .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lead b{font-size:16px}
.lead .when{font-size:12.5px;color:var(--muted);white-space:nowrap}
.lead .res{font-weight:600;color:var(--plate)}
.lead .meta{color:var(--muted)}
.lead .tap{font-size:13px}
@media (max-width:420px){ td,th{padding:5px 4px} .stat b{font-size:40px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">TALLEN Coaching</div>
    <h1>Coach admin</h1>
  </header>
  <div class="banner" id="status" role="status" hidden></div>
  <div id="app" hidden>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="week">
        <button type="button" data-week="-1" aria-label="Previous week">←</button>
        <strong id="weekLabel"></strong>
        <button type="button" data-week="1" aria-label="Next week" id="nextWeek">→</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="clients" id="clients"></div>
      <h2 class="sect">Quiz leads</h2>
      <div class="leads" id="leads"></div>
      <p class="legend">Target = top of the rep range for that exercise (the client's own range for compound lifts if they've set one). Last week = the previous time they did that exercise in that session.</p>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL = 'https://fxvrquxurenrfmenqnnu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RAv9EjgkbjA5F8QgVEJHow_3oyylnUO';
function rpc(fn, args){
  const headers = { 'Content-Type':'application/json', apikey: SUPABASE_KEY };
  if(!SUPABASE_KEY.startsWith('sb_')) headers.Authorization = 'Bearer ' + SUPABASE_KEY;
  return fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers, body: JSON.stringify(args) })
    .then(async r => { if(!r.ok){ let t=''; try{ t = (await r.text()).slice(0,160); }catch(_){} throw new Error('http ' + r.status + ' ' + t); } return r.json(); });
}
function readKey(){
  const h = new URLSearchParams(location.hash.slice(1)); let k = h.get('k');
  try{ if(k) localStorage.setItem('tallen-admin', k); else k = localStorage.getItem('tallen-admin'); }catch(e){}
  return k;
}
const KEY = readKey();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtW = w => (w === '' || w == null || isNaN(Number(w))) ? '' : (Math.round(Number(w)*100)/100).toString();
function setStatus(m){ const el = $('status'); el.hidden = !m; el.textContent = m || ''; }

let week = 0, data = null, open = new Set();
function weekRange(offset){
  const n = new Date(); n.setHours(0,0,0,0);
  const mon = new Date(n); mon.setDate(n.getDate() - ((n.getDay() + 6) % 7) + offset * 7);
  const next = new Date(mon); next.setDate(mon.getDate() + 7);
  return { from: mon.getTime(), to: next.getTime() - 1, mon, sun: new Date(next.getTime() - 86400000) };
}
const ymd = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;

async function load(){
  if(!KEY){ setStatus('This link is missing your admin key. Use the admin link from Supabase.'); return; }
  setStatus('Loading…');
  const r = weekRange(week);
  try{
    const j = await rpc('get_admin', { p_key: KEY, p_from: r.from, p_to: r.to });
    if(!j.ok){ setStatus('This admin link isn’t valid.'); return; }
    data = j; setStatus(''); render();
  }catch(e){ setStatus('Couldn’t reach the server. (' + e.message + ')'); }
}

function render(){
  const r = weekRange(week);
  const fmt = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  $('weekLabel').textContent = week === 0 ? `This week · ${fmt(r.mon)} – ${fmt(r.sun)}` : `${fmt(r.mon)} – ${fmt(r.sun)}`;
  $('nextWeek').disabled = week >= 0;
  $('app').hidden = false;

  const lib = {}; (data.library || []).forEach(x => lib[x.id] = x);
  const plansBy = {}; (data.plans || []).forEach(p => { ((plansBy[p.client] ||= {})[p.workout] ||= { name: p.wname, ex: [] }).ex.push(p); });
  const all = (data.sessions || []).slice().sort((a,b) => (a.ts||0) - (b.ts||0));
  const inWeek = all.filter(s => s.ts >= r.from && s.ts <= r.to);
  const tasksBy = {}; (data.tasks || []).forEach(t => (tasksBy[t.client] ||= []).push(t.name));
  const dailyBy = {}; (data.daily || []).forEach(d => {
    const day = new Date(d.day + 'T12:00:00'); if(day < r.mon || day > r.sun) return;
    dailyBy[d.client] = (dailyBy[d.client] || 0) + Object.keys(d.done || {}).length;
  });
  const clients = (data.clients || []).filter(c => c.active && plansBy[c.id]);

  let trained = 0, notes = 0;
  const cards = clients.map(c => {
    const plan = plansBy[c.id] || {};
    /* variety versions (A2 = alternate of A) count as the same session */
    const base = k => String(k).replace(/\d+$/, '') || String(k);
    const visible = Object.entries(plan).filter(([k, w]) => base(k) === k && !String(w.name || '').startsWith('~') && w.ex.some(e => e.sets > 0));
    const mine = inWeek.filter(s => s.client === c.id);
    if(mine.length) trained++;
    notes += mine.filter(s => s.note).length;
    const doneKeys = new Set(mine.map(s => base(s.workout)));
    const doneVisible = visible.filter(([k]) => doneKeys.has(k)).length;
    const last = all.filter(s => s.client === c.id).pop();
    const pips = visible.map(([k, w]) => `<span class="pip${doneKeys.has(k) ? ' done' : ''}">${doneKeys.has(k) ? '✓ ' : ''}${esc(w.name || 'Workout ' + k)}</span>`).join('');
    const isOpen = open.has(c.id);
    const tasks = tasksBy[c.id];
    return `<section class="client">
      <button type="button" class="chead" data-client="${esc(c.id)}" aria-expanded="${isOpen}">
        <span class="cname">${esc(c.name)}</span>
        <span class="count${doneVisible >= visible.length && visible.length ? ' full' : ''}">${mine.length} of ${visible.length} ${visible.length === 1 ? 'session' : 'sessions'} <span class="chev">${isOpen ? '▲' : '▼'}</span></span>
        <span class="pips">${pips}</span>
        <span class="cmeta"><span>Last session: <strong>${last ? esc(last.date) : 'never'}</strong></span>${tasks ? `<span>朝: <strong>${dailyBy[c.id] || 0}/${tasks.length * 6}</strong></span>` : ''}${mine.some(s => s.note) ? '<span>📝 has notes</span>' : ''}${c.prefs && c.prefs.unit ? `<span>Units: <strong>${esc(c.prefs.unit)}</strong></span>` : ''}${c.prefs && c.prefs.rlo ? `<span>Rep range: <strong>${c.prefs.rlo}–${c.prefs.rhi}</strong></span>` : ''}</span>
      </button>
      ${isOpen ? `<div class="cbody">${mine.length ? mine.map(s => sessionHTML(c, s, plan, all, lib)).join('') : '<p class="empty">No sessions logged this week.</p>'}</div>` : ''}
    </section>`;
  });
  $('clients').innerHTML = cards.join('') || '<p class="empty">No clients yet.</p>';
  const leads = data.leads || [];
  $('leads').innerHTML = leads.length ? leads.slice(0, 50).map(l => {
    const a = l.answers || {}; const when = new Date(l.at).toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    return `<div class="lead"><div class="top"><b>${esc(l.name)}</b><span class="when">${esc(when)}</span></div>
      <div><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>${l.consent ? ' · ✓ happy to get emails' : ' · no marketing emails'}</div>
      <div class="res">${esc(l.result)}</div>${a.source ? `<div class="meta">From: ${esc(String(a.source).replace(/\/$/, ''))}</div>` : ''}
      <div class="meta">${esc([a.experience && `${a.experience} (${a.level})`, a.days && `${a.days} days`, a.minutes && `${a.minutes} min`, (a.goals || []).join(' + '), a.equipment].filter(Boolean).join(' · '))}</div>
      ${(l.taps || []).map(t => `<div class="tap">${t.msg ? `✉️ Wrote: ${esc(t.q)}` : `❓ Asked: ${esc(t.q)}`}</div>`).join('')}</div>`;
  }).join('') : '<p class="empty">No quiz submissions yet.</p>';
  $('stats').innerHTML = `
    <div class="stat"><b class="num">${inWeek.length}</b><span>${inWeek.length === 1 ? 'session' : 'sessions'} logged</span></div>
    <div class="stat"><b class="num">${trained}/${clients.length}</b><span>clients trained</span></div>
    <div class="stat"><b class="num">${notes}</b><span>${notes === 1 ? 'client note' : 'client notes'}</span></div>`;
}

function exName(p, pick, lib){
  if(pick && String(pick).startsWith('other:')) return String(pick).slice(6);
  if(pick && lib[pick]) return lib[pick].name;
  if(p && p.lib && lib[p.lib]) return lib[p.lib].name;
  return p ? p.name : '';
}
function sessionHTML(c, s, plan, all, lib){
  const w = plan[s.workout] || { name: 'Workout ' + s.workout, ex: [] };
  const order = {}; w.ex.forEach(p => order[p.id] = p.sort);
  const slots = Object.keys(s.sets || {}).sort((a,b) => (order[a] ?? 999) - (order[b] ?? 999));
  const prefs = c.prefs || {};
  const blocks = slots.map(slot => {
    const p = w.ex.find(e => e.id === slot);
    const pick = (s.picks && s.picks[slot]) || (p && p.lib) || '';
    const L = lib[pick];
    const hi = (L && L.compound && prefs.rhi) ? Number(prefs.rhi) : (p ? Number(p.hi) : null);
    const prev = all.filter(x => x.client === s.client && x.workout === s.workout && x.ts < s.ts && x.sets && x.sets[slot]
                    && (((x.picks && x.picks[slot]) || (p && p.lib) || '') === pick)).pop();
    const unitBase = p ? String(p.unit || 'kg') : 'kg';
    const rows = (s.sets[slot] || []).map((x, i) => {
      if(!x || (!x.r && !x.w)) return '';
      const reps = /^\d+$/.test(String(x.r)) ? Number(x.r) : null;
      const pr = prev && prev.sets[slot][i] && prev.sets[slot][i].r;
      const u = x.u ? x.u + unitBase.replace(/^\s*(kg|lbs?)/i, '') : unitBase;
      const hit = reps != null && hi ? reps >= hi : null;
      return `<tr><td>Set ${i+1}</td><td>${x.w !== '' && x.w != null ? `${esc(fmtW(x.w))} ${esc(u)}` : '<span style="color:var(--muted)">BW</span>'}</td><td class="c">${esc(x.r || '–')}</td><td class="c">${esc(pr || '–')}</td><td class="c">${hit == null ? '–' : `<span class="hit ${hit ? 'y' : 'n'}" title="Target ${hi}">${hit ? '✓' : '✗'}</span>`}</td></tr>`;
    }).join('');
    const box = s.settings && s.settings[slot];
    return `<div class="ex"><h4>${esc(exName(p, pick, lib))}${box ? ` <small>· ${esc(box)}</small>` : ''}${hi ? ` <small>· target ${hi}</small>` : ''}</h4>
      <table><thead><tr><th>Set</th><th>Weight</th><th class="c">Reps</th><th class="c">Last week</th><th class="c">Target</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  return `<div class="sess">
    <div class="shead"><h3>${esc(String(w.name || '').replace(/^~/, ''))}</h3><span>${esc(s.date)}</span></div>
    ${s.note ? `<div class="note">📝 ${esc(s.note)}</div>` : ''}
    ${blocks}
  </div>`;
}

document.addEventListener('click', e => {
  const wk = e.target.closest('[data-week]');
  if(wk){ week = Math.min(0, week + Number(wk.dataset.week)); load(); return; }
  const ch = e.target.closest('[data-client]');
  if(ch){ const id = ch.dataset.client; open.has(id) ? open.delete(id) : open.add(id); render(); }
});
window.addEventListener('hashchange', () => location.reload());
load();
</script>
</body>
</html>
